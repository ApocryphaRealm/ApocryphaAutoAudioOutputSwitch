; Auto Audio Output Switch - settings
;
; Skyrim picks an audio output once, at startup, and goes silent if that device is removed. This plugin lets the
; game move to another output device while it runs.

[General]
; 1 = manage the game's output device. 0 = leave it exactly as the game chooses (nothing is changed).
bEnabled=1

; The device the game should use whenever it is connected. Part of its name as Windows shows it in Sound settings
; (for example: Headphones, or Realtek USB Audio), matched without regard to case; the first device whose name
; contains it is used. Leave empty to use the Windows default output device.
sPreferredDevice=

; 1 = when no preferred device is set (or it is not connected), follow the Windows default output device as it
; changes. 0 = stay on the current device until it is removed.
bSwitchOnDefaultChange=1

; 1 = when an output device is connected after the game has started (a headset plugged in or switched on), move the
; game's sound to it. A connected preferred device still comes first. 0 = ignore devices connected while playing.
bSwitchToNewDevice=1

; Milliseconds of quiet after a device change before the game switches (Windows reports one change as several
; events). 0 to 10000.
uResetDelayMs=500

[Keyboard]
; Skyrim takes the keyboard for itself, so Windows ignores the volume, mute and other media keys while you play.
; 1 = the game's keyboard is non-exclusive and Windows handles the media keys, the way Media Keys Fix SKSE does. 0 = the
; game keeps the keyboard. When Media Keys Fix SKSE itself is installed, it does this and these settings are not used.
; All three apply the next time the game starts.
bMediaKeys=1

; 1 = the Windows key does not open the Start menu while you play. 0 = it does.
bDisableWindowsKey=1

; 1 = accent keys (US-International and similar layouts) type straight away in the console instead of waiting for
; the next key. 0 = leave them as they are.
bDisableDeadKeys=0

[Debug]
; 0 trace (everything, the default), 1 debug, 2 info, 3 warning, 4 error, 5 critical, 6 off.
; Log: Documents\My Games\Skyrim Special Edition\SKSE\ApocryphaAutoAudioOutputSwitch.log
uLogLevel=0
